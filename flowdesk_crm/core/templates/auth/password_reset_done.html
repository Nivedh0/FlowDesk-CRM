{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlowDesk || Check Email</title>
    <link rel="shortcut icon" href="{% static 'assets/images/flowicon.ico' %}">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card-shell {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        }

        h1 {
            font-size: 1.7rem;
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            color: #6b7280;
            margin-bottom: 0;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="card-shell">
        <h1>Check your email</h1>
        <p>If an account exists for that email address, FlowDesk has sent a password reset link.</p>
        <p class="mt-3"><a href="{% url 'login' %}">Return to login</a></p>
    </main>
</body>
</html>
